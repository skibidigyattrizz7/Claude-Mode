<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchside 3D — renderer harness</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #app { position: absolute; inset: 0; }
  #hud { position: absolute; left: 8px; top: 8px; color: #fff; font: 12px/1.4 monospace; background: rgba(0,0,0,.5); padding: 6px 8px; border-radius: 4px; pointer-events: none; white-space: pre; }
  #hud.hide { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script type="module">
import { createRenderer } from './js/engine/render/index.js';
import { ANIM, PHASE, PITCH } from './js/engine/core/constants.js';
import { BRAZIL, FRANCE } from './js/engine/tests/sampleTeams.mjs';

const qs = new URLSearchParams(location.search);
const cameraMode = qs.get('camera') || 'broadcast';
const stadium = qs.get('stadium') || 'day';
const quality = qs.get('quality') || 'med';
const mode = qs.get('mode') || 'synthetic';
const hud = document.getElementById('hud');
if (qs.has('nohud')) hud.classList.add('hide');

const R = createRenderer(document.getElementById('app'), { home: BRAZIL, away: FRANCE, stadium, quality });
R.setCamera(cameraMode);
window.addEventListener('resize', () => R.resize());
window.__R = R;
window.__errors = [];
window.addEventListener('error', (e) => window.__errors.push(String(e.message)));

// ------------------------------------------------------------------ synthetic view
const F433 = [[-50, 0], [-36, -22], [-38, -8], [-38, 8], [-36, 22], [-22, -12], [-24, 0], [-22, 12], [-8, -22], [-4, 0], [-8, 22]];
const F442 = [[50, 0], [36, 22], [38, 8], [38, -8], [36, -22], [20, 22], [22, 7], [22, -7], [20, -22], [6, 5], [6, -5]];
const ANIM_CYCLE = [ANIM.KICK, ANIM.WINDUP, ANIM.SLIDE, ANIM.HEAD, ANIM.CELEB, ANIM.THROW, ANIM.FALL, ANIM.HOLD, ANIM.TACKLE, ANIM.SKILL, ANIM.WALL, ANIM.CHEST, ANIM.GKREADY];
const forced = new Map(); // idx -> {anim, t0, p, speed, x, z, face}
let fxList = [], fxId = 0;
let goalAt = -99;

function ballPath(t) {
  // loop: dribble across, cross, shot into net every 16 s
  const T = 16, u = t % T;
  if (u < 11) {
    const x = -30 + u * 6.5 + Math.sin(u * 0.9) * 6, z = Math.sin(u * 0.7) * 18;
    const vx = 6.5 + Math.cos(u * 0.9) * 5.4, vz = Math.cos(u * 0.7) * 12.6;
    // a lofted pass from u=4..6
    let y = 0.11, vy = 0;
    if (u > 4 && u < 6) { const s = u - 4; y = 0.11 + 9.81 * s - 4.905 * s * s; vy = 9.81 - 9.81 * s; }
    return [x, y, z, vx, vy, vz];
  }
  // shot from (41.5, z) into goal at x=53.2
  const s = Math.min(1, (u - 11) / 0.6);
  if (s < 1) return [41 + s * 12.2, 0.2 + s * 1.3, 4 - s * 5.5, 20, 2, -9];
  return [53.3 + Math.min(0.5, (u - 11.6) * 0.8), 1.5 - Math.min(1.35, (u - 11.6) * 1.5), -1.5, 0.2, -1, 0];
}

function synthView(t) {
  const p = new Array(22 * 7).fill(0);
  const b = ballPath(t);
  const u = t % 16;
  const goalPhase = u > 11.6 && u < 15.5;
  if (u > 11.6 && goalAt < t - 10) { goalAt = t; fxList.push({ id: ++fxId, t, k: 'goal', team: 0, pi: 9, og: 0 }); }
  fxList = fxList.filter((f) => t - f.t < 1.5);
  for (let i = 0; i < 22; i++) {
    const team = i < 11 ? 0 : 1;
    const f = team ? F442[i - 11] : F433[i];
    const shift = Math.max(-15, Math.min(15, b[0] * 0.35));
    const w = 0.35 + (i % 5) * 0.12, ph = i * 1.7;
    const A = i % 11 === 0 ? 1.5 : 5 + (i % 3) * 3;
    let x = f[0] + shift + A * Math.sin(w * t + ph);
    let z = f[1] * 0.9 + (A * 0.7) * Math.sin(w * 0.8 * t + ph * 1.3) + b[2] * 0.15;
    const vx = A * w * Math.cos(w * t + ph), vz = A * 0.7 * w * 0.8 * Math.cos(w * 0.8 * t + ph * 1.3);
    let face = Math.atan2(vz, vx), speed = Math.hypot(vx, vz);
    let anim = ANIM.RUN, animT = 0, animP = 0;
    if (i % 11 === 0) { // GK: ready stance facing out; dives when shot
      x = team ? 50.5 : -50.5; z = Math.max(-2.5, Math.min(2.5, b[2] * 0.2)); face = team ? Math.PI : 0; speed = 0.3; anim = ANIM.GKREADY;
      if (team === 1 && u > 10.8 && u < 13.5) { anim = ANIM.DIVE; animT = u - 10.8; animP = -1 * (1 + 1.2); z = Math.max(-3.4, -2.5 * Math.min(1, animT / 0.45)); }
    }
    // cycling one-shot anims on a few players
    if (i === 5 || i === 13 || i === 7) {
      const k = Math.floor((t + i) / 1.6) % ANIM_CYCLE.length;
      anim = ANIM_CYCLE[(k + i) % ANIM_CYCLE.length]; animT = (t + i) % 1.6;
      animP = anim === ANIM.KICK ? 1 : anim === ANIM.WINDUP ? Math.min(1, animT) : anim === ANIM.HEAD || anim === ANIM.WALL ? 0.4 : anim === ANIM.SKILL ? (k % 4) : anim === ANIM.CELEB ? k % 3 : 0;
    }
    if (goalPhase && team === 0 && i % 11 !== 0) { anim = ANIM.CELEB; animT = u - 11.6; animP = i === 9 ? 1 : 0; }
    const fo = forced.get(i);
    if (fo) {
      anim = fo.anim; animT = fo.static ? fo.t0 : (t - fo.t0) % (fo.loop || 99); animP = fo.p ?? 0; speed = fo.speed ?? speed;
      if (fo.x !== undefined) { x = fo.x; z = fo.z; face = fo.face ?? face; }
      if (fo.move) { x += fo.move[0] * t; z += fo.move[1] * t; }
    }
    const o = i * 7;
    p[o] = x; p[o + 1] = z; p[o + 2] = face; p[o + 3] = anim; p[o + 4] = animT; p[o + 5] = animP; p[o + 6] = speed;
  }
  return {
    v: 1, t, ph: goalPhase ? PHASE.GOAL : PHASE.PLAY, spt: -1, spk: -1, h: 1, cl: t * 15, ad: 0, sc: [0, 0], dir: 1,
    b, bo: -1, bh: 0, p, so: 0, yc: '', c: [9, 20], stm: [1, 1], st: [50, 0, 0, 0, 0, 0, 0], fx: fxList.slice(), subs: [], rv: 0, scr: [], gt: 0, pt: 0,
  };
}

// ------------------------------------------------------------------ real sim (optional)
let sim = null, viewFromSim = null;
if (mode === 'sim') {
  const [{ MatchSim }, snap] = await Promise.all([import('./js/engine/core/sim.js'), import('./js/engine/core/snapshot.js')]);
  viewFromSim = snap.viewFromSim;
  sim = new MatchSim({ home: BRAZIL, away: FRANCE, halfMinutes: 3, difficulty: 'pro', controllers: { home: 'ai', away: 'ai' }, seed: +(qs.get('seed') || 7) });
  const warm = +(qs.get('warm') || 0);
  for (let i = 0; i < warm * 120; i++) sim.step(1 / 120, [null, null]);
}

// ------------------------------------------------------------------ loop
let simT = +(qs.get('t') || 0);
let paused = qs.has('freeze');
let last = performance.now();
let frames = 0, fpsT = 0, fps = 0;
let controlled = [9, 20];
R.setControlled(controlled);
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) {
    if (sim) { const n = Math.max(1, Math.round(dt * 120)); for (let i = 0; i < n; i++) sim.step(1 / 120, [null, null]); }
    else simT += dt;
  }
  const view = sim ? viewFromSim(sim) : synthView(simT);
  R.render(view, paused ? 0.016 : dt);
  frames++; fpsT += dt;
  if (fpsT > 1) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  hud.textContent = `fps ${fps.toFixed(1)}  cam ${cameraMode}  ${stadium}/${quality}  t=${(sim ? sim.t : simT).toFixed(2)}\ncalls ${R._debug.info().render.calls}  tris ${R._debug.info().render.triangles}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// harness API for automated screenshots
window.__harness = {
  get fps() { return fps; },
  setTime(t) { simT = t; },
  pause(v = true) { paused = v; },
  force(i, o) { if (o) forced.set(i, o); else forced.delete(i); },
  clearForced() { forced.clear(); },
  cam(pos, look, fov) { R._debug.setCameraOverride(pos, look, fov); },
  setCamera(m) { R.setCamera(m); },
  setControlled(c) { controlled = c; R.setControlled(c); },
  step(n = 1, dt = 1 / 60, advance = true) { R._debug.noDraw = true; for (let i = 0; i < n; i++) { if (advance) { if (sim) { sim.step(1 / 120, [null, null]); sim.step(1 / 120, [null, null]); } else simT += dt; } R.render(sim ? viewFromSim(sim) : synthView(simT), dt); } R._debug.noDraw = false; },
};
</script>
</body>
</html>
