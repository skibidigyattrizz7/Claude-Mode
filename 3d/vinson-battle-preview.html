<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vinson — Cinematic Fight</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23071011'/%3E%3Cpath d='M7 7l9 18 9-18' fill='none' stroke='%23d73d35' stroke-width='4'/%3E%3C/svg%3E"><style>html,body{margin:0;background:#071011;color:#fff;font-family:system-ui}main{min-height:100dvh;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box}h1{font-size:24px}p{font-size:16px;line-height:1.5;max-width:36rem}button{font:inherit;color:white;background:#8b2329;border:1px solid #e16969;padding:14px 24px;cursor:pointer}#error{color:#ffaaaa}</style></head><body><main><h1>Cinematic Fight</h1><p>WASD or arrows to move. Hold J or the play area to attack. Space to dodge. Keys 1–4 choose a weapon. Click dialogue or press Enter to continue. Touch controls are available.</p><button id="play">Play fight</button><p id="error" role="alert"></p></main><script type="module">import { launchVinsonBattle } from './js/meta/ui/vinsonbattle.js?v=vinson15';
let active=null;
const play=document.querySelector('#play');
function start(){
 try { active=launchVinsonBattle({ seed:1, onWin:async()=>({ok:true,immune:true}), onClaim:async()=>({ok:true}), onClose:()=>{active=null;play.focus()} }); }
 catch(e){ document.querySelector('#error').textContent='The fight could not start. Refresh to retry.'; console.error(e); }
}
play.onclick=start;
start();

if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();
 try{Promise.resolve(document.modelContext.registerTool({name:'start_vinson_fight',description:'Open the Vinson fight start screen, as the Play fight button does.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('Expected an empty object.');if(!active)start();return {opened:!!active};}},{signal:lifecycle.signal})).catch(()=>{});}catch{}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
</script></body></html>
