<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="css/main.css">

<div class="bg" aria-hidden="true">
  <div class="bg-pitch"></div>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-glow g3"></div>
  <div class="bg-sweep"></div>

</div>
<main id="app" aria-live="polite"></main>
<noscript><div class="boot-fail"><h1>Pitchside 3D</h1><p>This game needs JavaScript enabled.</p></div></noscript>
<div class="boot-fail" id="boot-fail" hidden>
  <h1>Pitchside 3D</h1>
  <p>The game could not start. Please use a recent Chrome, Edge, Firefox or Safari, and open it through a web server (not <code>file://</code>).</p>
  <p><a href="../index.html">Back to all games</a></p>
</div>
<script>
  // If the ES module never boots (old browser, file://, syntax error), show a message instead of a blank page.
  setTimeout(function () {
    if (!document.documentElement.classList.contains('ready')) document.getElementById('boot-fail').hidden = false;
  }, 5000);
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
